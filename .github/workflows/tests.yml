name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: ruff check main.py tests
      - run: ruff format --check main.py tests
      - run: python -m pip check
      - run: node --check static/app.js
      - run: node --check sw.js
      - run: docker build -t psumenu-ci .
      - name: Check the production container
        run: |
          docker run -d --name psumenu-test -p 127.0.0.1:8080:8080 psumenu-ci
          trap 'docker rm -f psumenu-test' EXIT
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1 --connect-timeout 2 --max-time 5 http://127.0.0.1:8080/health
